<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NEXLIC — inteligência, operação e automação para licitações. Encontre oportunidades, analise editais com IA e gerencie o processo em um só lugar.">
  <meta name="theme-color" content="#071B3E">
  <title>NEXLIC — Sistema Operacional de Licitações com IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <noscript><div style="padding:40px;font-family:system-ui">Ative o JavaScript para visualizar a landing page NEXLIC.</div></noscript>
  <script>
  (async function(){
    const app=document.getElementById('app');
    try{
      const files=['parts/1.html','parts/2.html','parts/3.html','parts/4.html','parts/5.html','parts/6.html','parts/7.html'];
      const responses=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'})));
      if(responses.some(r=>!r.ok)) throw new Error('Falha ao carregar a interface');
      const html=(await Promise.all(responses.map(r=>r.text()))).join('');
      app.innerHTML=html;
      const script=document.createElement('script');
      script.src='app.js';
      script.defer=true;
      document.body.appendChild(script);
    }catch(error){
      app.innerHTML='<main style="max-width:760px;margin:120px auto;padding:24px;font-family:system-ui"><h1>NEXLIC</h1><p>Não foi possível carregar a interface completa. Atualize a página para tentar novamente.</p></main>';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
